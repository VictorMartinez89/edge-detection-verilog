name: RTL verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cocotb
        run: pip install cocotb==2.0.1 numpy

      - name: Lint (compile every RTL file)
        run: make lint

      - name: Self-checking SystemVerilog testbench
        run: make tb

      - name: cocotb regression against the Python golden models
        run: make test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/results_*.xml
